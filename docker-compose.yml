# Local Postgres, used to verify the app behaves identically on the dialect it
# actually runs on in production. The app itself is run natively via `make run`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sensors
    ports:
      # Host 5432 is commonly taken (this machine already runs several Postgres
      # containers), so the local port is deliberately unusual.
      - "5440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
